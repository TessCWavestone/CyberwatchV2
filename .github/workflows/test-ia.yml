# Cyber Watch — test du tri par l'IA sur le jeu de référence (300 articles réels notés)
# Lancement à la main : Actions › « Cyber Watch - test du tri par l'IA » › Run workflow.
# Ne modifie ni les données ni le site : le rapport s'affiche dans le résumé de l'exécution
# et se télécharge dans « Artifacts ».

name: Cyber Watch - AI triage test

on:
  workflow_dispatch:
    inputs:
      modele:
        description: "Model (qwen7b = most reliable; phi35 = faster; llama3b)"
        default: "qwen7b"
      pages:
        description: "Read the article pages (oui = yes / non = no)"
        default: "oui"
      max:
        description: "Number of articles (empty = all 300)"
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      # Même ménage que la collecte (veille.yml) : le serveur gratuit de GitHub est livré avec des outils inutiles
      # ici (Android, .NET, Haskell, CodeQL…) ; sans ce ménage, les modèles d'IA peuvent remplir le disque
      # (collecte du 02/11/2026 : « No space left on device »). Environ 20 Go libérés.
      - name: Free up disk space
        run: |
          echo "Disk space before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "Disk space after:"; df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and the triage AI
        env:
          PIP_NO_CACHE_DIR: "1"   # pip ne garde pas de copie des paquets téléchargés (plusieurs Go économisés)
        run: |
          pip install -r requirements.txt
          pip install -r requirements-ia.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ia-${{ inputs.modele }}-v1

      - name: Remaining disk space (check)
        run: df -h / && du -sh ~/.cache/huggingface 2>/dev/null || true

      - name: Run the test
        env:
          IA_MODELE: ${{ inputs.modele }}
          PAGES: ${{ inputs.pages }}
          MAX: ${{ inputs.max }}
          VEILLE_ENTREPRISE: ${{ secrets.VEILLE_ENTREPRISE }}
        run: |
          python tests/ia/test_tri.py
          cat tests/ia/rapport.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-ia
          path: |
            tests/ia/rapport.md
            tests/ia/resultats.json
