# Cyber Watch — test rétrospectif « à l'aveugle » (NIS2, CRA, AI Act, EHDS, ENS)
# Lancement à la main : Actions › « Cyber Watch - test rétrospectif » › Run workflow.
# Ne modifie ni les données ni le site : le rapport s'affiche dans le résumé de l'exécution
# (page de l'exécution, en bas) et se télécharge dans « Artifacts ».

name: Cyber Watch - test rétrospectif

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances et le modèle de pertinence
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-pertinence.txt

      - name: Garder en cache le modèle
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: modele-pertinence-test-v1

      - name: Lancer le test (vraie note du modèle)
        run: |
          python tests/retro/test_aveugle.py
          cat tests/retro/rapport.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: test-retrospectif
          path: |
            tests/retro/rapport.md
            tests/retro/resultats.json
