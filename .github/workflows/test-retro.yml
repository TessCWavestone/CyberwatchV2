# Cyber Watch — test rétrospectif « à l'aveugle » (v7)
# Lancement à la main : Actions › « Cyber Watch - test rétrospectif » › Run workflow.
# Ne modifie ni les données ni le site : le rapport s'affiche dans le résumé de l'exécution
# (page de l'exécution, en bas) et se télécharge dans « Artifacts ».
#
# Question : en remontant dans le temps, SANS connaître le nom du texte (ex. NIS2), le site aurait-il fait
# remonter ce texte dès ses premières publications ? v7 : rejoue la chaîne ACTUELLE (règles + lecture de la page
# + IA de tri + règles des points clés v13).

name: Cyber Watch - retrospective test

on:
  workflow_dispatch:
    inputs:
      textes:
        description: "Texts tested (NIS2, CRA, AI Act, EHDS, ENS, DORA, Data Act, CER, PLD, UK CSR Bill; tous = all)"
        default: "NIS2"
      modes:
        description: "Reading modes (mots = keywords, sens = semantic, page, ia = current site pipeline)"
        default: "mots,ia"
      bruit:
        description: "Also measure noise on real data (oui = yes / non = no; +30 min)"
        default: "non"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # Même ménage que la collecte (veille.yml) : le serveur gratuit de GitHub est livré avec des outils inutiles
      # ici (Android, .NET, Haskell, CodeQL…) ; sans ce ménage, les modèles d'IA peuvent remplir le disque
      # (collecte du 02/11/2026 : « No space left on device »). Environ 20 Go libérés.
      - name: Free up disk space
        run: |
          echo "Disk space before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "Disk space after:"; df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies, models (relevance + semantic) and the triage AI
        env:
          PIP_NO_CACHE_DIR: "1"   # pip ne garde pas de copie des paquets téléchargés (plusieurs Go économisés)
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-pertinence.txt
          pip install -r requirements-ia.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: modeles-test-v7

      - name: Remaining disk space (check)
        run: df -h / && du -sh ~/.cache/huggingface 2>/dev/null || true

      - name: Run the test
        env:
          TEXTES: ${{ inputs.textes }}
          MODES: ${{ inputs.modes }}
          BRUIT: ${{ inputs.bruit }}
          VEILLE_ENTREPRISE: ${{ secrets.VEILLE_ENTREPRISE }}
        run: |
          python tests/retro/test_aveugle.py
          cat tests/retro/rapport.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-retrospectif
          path: |
            tests/retro/rapport.md
            tests/retro/resultats.json
