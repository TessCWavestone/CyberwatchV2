# Cyber Watch — collecte automatique chaque lundi à 7 h (heure de Paris)
# + bouton « Run workflow » (ou « Lancer une mise à jour » sur le site).
#
# Version « dépôt dédié » : le site, les données et ce fichier sont tous sur main.

name: Cyber Watch - collection

on:
  schedule:
    # GitHub ne connaît que l'heure UTC et peut retarder ses lancements programmés de plusieurs
    # heures (serveurs chargés le lundi matin). Deux créneaux pour couvrir l'heure d'été et
    # d'hiver ; l'étape « Vérifier l'horaire » ne lance la collecte qu'une fois par lundi,
    # après 7 h (heure de Paris), et ignore l'autre créneau (quelques secondes, gratuit).
    - cron: "17 5 * * 1"    # 7 h 17 à Paris en été
    - cron: "17 6 * * 1"    # 7 h 17 à Paris en hiver
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
    inputs:
      rattrapage_depuis:
        description: "Catch up archives since this date (YYYY-MM-DD). Leave empty for a normal collection."
        required: false
        default: ""
      retester_inactives:
        description: "Also re-test inactive sources (otherwise: automatically on the 1st Monday of the month)"
        type: boolean
        required: false
        default: false

env:
  # dépôt dédié : tout est sur la branche main. v15 : une exécution lancée à la main depuis une autre branche
  # (essai d'une nouvelle version) utilise le code de cette branche et n'enregistre ni ne publie rien.
  BRANCHE_VEILLE: ${{ github.ref_name }}

permissions:
  contents: write   # pour enregistrer les nouvelles données sur la branche
  pages: write      # pour publier le site
  id-token: write

concurrency:
  group: cyberwatch
  cancel-in-progress: false

jobs:
  # v15 (24/11/2026, passage à l'échelle mondiale) : la collecte se fait en 3 temps.
  #   1. preparation : lecture des sources et des pages, règles -> liste des articles à faire juger par l'IA ;
  #   2. tri-ia      : NB_LOTS machines en parallèle jugent chacune une part de la liste (collecte/lots.py) ;
  #   3. collecte    : assemblage (avis des lots repris), traduction, points clés, résumés, site — comme avant.
  # Si un lot échoue, ses articles sont jugés à la collecte suivante ; la collecte n'est jamais bloquée.
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      lancer: ${{ steps.garde.outputs.lancer }}
    steps:
      - name: Fetch the watch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCHE_VEILLE }}

      - name: Check the schedule (Monday 7 am, Paris time)
        id: garde
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "lancer=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          heure=$(TZ=Europe/Paris date +%-H)
          jour=$(TZ=Europe/Paris date +%Y-%m-%d)
          derniere=$(cut -c1-10 data/version_courante.txt 2>/dev/null || echo "")
          if [ "$heure" -ge 7 ] && [ "$derniere" != "$jour" ]; then
            echo "lancer=true" >> "$GITHUB_OUTPUT"
          else
            echo "Slot skipped (it is ${heure}:00 in Paris, last collection: ${derniere:-none})."
            echo "lancer=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free up disk space
        if: steps.garde.outputs.lancer == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium || true

      - name: Install Python
        if: steps.garde.outputs.lancer == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.garde.outputs.lancer == 'true'
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-traduction.txt
          pip install -r requirements-pertinence.txt

      - name: Cache the models (downloaded only once)
        if: steps.garde.outputs.lancer == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/.cache/huggingface
          key: modeles-v7

      - name: Prepare the articles to be assessed by the AI
        if: steps.garde.outputs.lancer == 'true'
        run: python collecte/collecte.py
        env:
          MODE_COLLECTE: preparation
          RATTRAPAGE_DEPUIS: ${{ github.event.inputs.rattrapage_depuis }}

      # liste privée (texte des pages compris) : gardée 3 jours dans l'exécution, jamais publiée
      - name: Hand the list over to the AI batches
        if: steps.garde.outputs.lancer == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a-juger
          path: lots/a_juger.json
          retention-days: 3

  tri-ia:
    needs: preparation
    if: needs.preparation.outputs.lancer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true      # un lot en échec ne bloque pas la collecte
    strategy:
      fail-fast: false
      matrix:
        lot: [0, 1, 2, 3]        # NB_LOTS = 4 : ajouter des numéros (et changer NB_LOTS) quand le volume augmente
    env:
      NB_LOTS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCHE_VEILLE }}

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the triage AI build (portable, compiled once)
        uses: actions/cache@v4
        with:
          path: ~/llama-wheel
          key: llama-cpp-portable-0.3.16-py312-v1

      - name: Install the triage AI (open source, free)
        env:
          PIP_NO_CACHE_DIR: "1"
        run: bash collecte/installer_ia.sh

      - name: Cache the AI model (downloaded only once)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--bartowski--Qwen2.5-7B-Instruct-GGUF
          key: modele-ia-qwen7b-v1

      - name: Get the list of articles
        uses: actions/download-artifact@v4
        with:
          name: a-juger
          path: lots

      - name: Sort articles with the AI (batch ${{ matrix.lot }})
        run: python collecte/lots.py juger ${{ matrix.lot }} $NB_LOTS lots
        env:
          VEILLE_ENTREPRISE: ${{ secrets.VEILLE_ENTREPRISE }}

      - name: Hand the assessments over to the assembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts-${{ matrix.lot }}
          path: lots/verdicts_*.json
          retention-days: 3
          if-no-files-found: ignore

  collecte:
    needs: [preparation, tri-ia]
    if: always() && needs.preparation.outputs.lancer == 'true'

    # version figée : « ubuntu-latest » passe à Ubuntu 26 le 19/10/2026 (évite une collecte cassée par ce changement)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # pas d'« environment » ici : la collecte et l'enregistrement des données ne doivent jamais
    # attendre une autorisation de déploiement ; seule la publication (job suivant) en dépend
    outputs:
      lancer: ${{ steps.garde.outputs.lancer }}
    steps:
      - name: Fetch the watch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCHE_VEILLE }}
          fetch-depth: 0

      # v15 : l'horaire est vérifié par la préparation (job « preparation ») ; ici on suit sa décision
      - name: Continue the collection (decided by the preparation)
        id: garde
        run: echo "lancer=${{ needs.preparation.outputs.lancer }}" >> "$GITHUB_OUTPUT"

      # Le serveur gratuit de GitHub est livré avec des outils dont la collecte n'a pas besoin (Android, .NET,
      # Haskell, CodeQL…) ; la collecte installe l'IA de tri (~5 Go) et d'autres modèles : sans ce ménage, le disque
      # peut être plein (collecte du 02/11/2026 : « No space left on device »). Environ 20 Go libérés.
      - name: Free up disk space
        if: steps.garde.outputs.lancer == 'true'
        run: |
          echo "Disk space before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "Disk space after:"; df -h /

      # Veille RKC : fichiers (mails .eml/.msg, Word) déposés dans un dépôt PRIVÉ.
      # Facultatif : variable RKC_DEPOT (ex. mon-compte/cyberwatch-rkc) + secret RKC_TOKEN.
      # Le dossier rkc/ n'est jamais publié ni enregistré dans ce dépôt public.
      - name: Fetch RKC watch files (private repository)
        if: steps.garde.outputs.lancer == 'true' && vars.RKC_DEPOT != ''
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.RKC_DEPOT }}
          token: ${{ secrets.RKC_TOKEN }}
          path: rkc

      - name: Install Python
        if: steps.garde.outputs.lancer == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PIP_NO_CACHE_DIR : pip ne garde pas de copie des paquets téléchargés (plusieurs Go économisés)
      - name: Install dependencies
        if: steps.garde.outputs.lancer == 'true'
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          pip install -r requirements.txt
          # police libre DejaVu pour l'export PDF (accents, polonais, tchèque, grec…)
          sudo apt-get install -y -qq fonts-dejavu-core > /dev/null || true

      # Traduction (Argos Translate) et note de pertinence (sentence-transformers) :
      # modèles open source gratuits. Si cette étape échoue, la collecte continue
      # (textes en langue d'origine, note calculée avec les mots-clés).
      - name: Install open-source models (translation, relevance)
        if: steps.garde.outputs.lancer == 'true'
        continue-on-error: true
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-traduction.txt
          pip install -r requirements-pertinence.txt

      # v7 : petite IA open source de tri (llama.cpp, version précompilée pour processeur). Si elle ne
      # s'installe pas, la collecte continue avec les règles seules.
      - name: Cache the triage AI build (portable, compiled once)
        if: steps.garde.outputs.lancer == 'true'
        uses: actions/cache@v4
        with:
          path: ~/llama-wheel
          key: llama-cpp-portable-0.3.16-py312-v1

      - name: Install the triage AI (open source, free)
        if: steps.garde.outputs.lancer == 'true'
        continue-on-error: true
        env:
          PIP_NO_CACHE_DIR: "1"
        run: bash collecte/installer_ia.sh

      - name: Cache the models (downloaded only once)
        if: steps.garde.outputs.lancer == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/.cache/huggingface
          key: modeles-v7

      - name: Get the AI assessments from the parallel batches
        if: steps.garde.outputs.lancer == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: verdicts-*
          path: lots/verdicts
          merge-multiple: true

      - name: Collect new articles
        if: steps.garde.outputs.lancer == 'true'
        run: python collecte/collecte.py
        env:
          # v15 : avis déjà donnés par les lots parallèles (l'IA ne juge ici que ce qui manque)
          VERDICTS_DIR: lots/verdicts
          # nom de l'entreprise suivie, donné seulement à l'IA de tri (secret : jamais dans le dépôt ni sur le site)
          VEILLE_ENTREPRISE: ${{ secrets.VEILLE_ENTREPRISE }}
          # v11 : mot de passe qui chiffre les résumés des slides (secret : jamais dans le dépôt ni sur le site)
          SLIDES_MOT_DE_PASSE: ${{ secrets.SLIDES_MOT_DE_PASSE }}
          RATTRAPAGE_DEPUIS: ${{ github.event.inputs.rattrapage_depuis }}
          RETEST_INACTIVES: ${{ github.event.inputs.retester_inactives }}
          # Journal officiel français : données ouvertes de la DILA, aucun identifiant nécessaire.

      - name: Remaining disk space (check)
        if: always() && steps.garde.outputs.lancer == 'true'
        run: df -h / && du -sh ~/.cache/huggingface ~/.local/share/argos-translate 2>/dev/null || true

      # Site public assemblé AVANT l'enregistrement : le même contenu part sur GitHub Pages (_site)
      # et dans le dossier static/ du dépôt, lu par la plateforme d'hébergement de l'entreprise.
      - name: Prepare the site (public files only)
        if: steps.garde.outputs.lancer == 'true'
        run: |
          rm -rf rkc   # le contenu RKC ne doit jamais être publié
          bash collecte/preparer_site.sh _site
          bash collecte/preparer_site.sh static

      # v15 : essai depuis une autre branche que main : rien n'est enregistré ni publié, les données produites
      # sont seulement jointes à l'exécution (« Artifacts ») pour comparaison
      - name: Test run on a branch - keep the results for comparison
        if: steps.garde.outputs.lancer == 'true' && github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: resultats-essai
          path: |
            data/actualites.json
            data/alertes.json
            data/ecartes.json
            data/pressentis.json
            data/etat_sources.json
          retention-days: 7

      - name: Save data and tag the version
        if: steps.garde.outputs.lancer == 'true' && github.ref_name == 'main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf rkc   # le contenu RKC ne doit jamais être publié
          # static/ : copie du site pour la plateforme de l'entreprise ; vendor/ : html2pdf téléchargé
          git add data static vendor
          if git diff --cached --quiet; then
            echo "No changes."
          else
            version=$(cat data/version_courante.txt)
            git commit -m "Watch: version of ${version}"
            # si une source a été ajoutée depuis le site pendant la collecte
            git pull --rebase origin ${{ env.BRANCHE_VEILLE }}
            git push origin HEAD:${{ env.BRANCHE_VEILLE }}
            # une étiquette par version : le site y renvoie pour consulter l'état complet
            git tag "veille-${version}" && git push origin "veille-${version}" || true
          fi

      - uses: actions/configure-pages@v5
        if: steps.garde.outputs.lancer == 'true' && github.ref_name == 'main'
      - uses: actions/upload-pages-artifact@v3
        if: steps.garde.outputs.lancer == 'true' && github.ref_name == 'main'
        with:
          path: _site

  # Publication du site, séparée : si GitHub bloque le déploiement (autorisation, incident),
  # les données sont déjà enregistrées et la publication peut être relancée seule (« Re-run jobs »).
  publication:
    needs: collecte
    if: needs.collecte.outputs.lancer == 'true' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publication
        uses: actions/deploy-pages@v4
