# Cyber Watch — collecte automatique chaque lundi à 7 h (heure de Paris)
# + bouton « Run workflow » (ou « Lancer une mise à jour » sur le site).
#
# Version « dépôt dédié » : le site, les données et ce fichier sont tous sur main.

name: Cyber Watch - collecte

on:
  schedule:
    # GitHub ne connaît que l'heure UTC et peut retarder ses lancements programmés de plusieurs
    # heures (serveurs chargés le lundi matin). Deux créneaux pour couvrir l'heure d'été et
    # d'hiver ; l'étape « Vérifier l'horaire » ne lance la collecte qu'une fois par lundi,
    # après 7 h (heure de Paris), et ignore l'autre créneau (quelques secondes, gratuit).
    - cron: "17 5 * * 1"    # 7 h 17 à Paris en été
    - cron: "17 6 * * 1"    # 7 h 17 à Paris en hiver
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
    inputs:
      rattrapage_depuis:
        description: "Rattrapage des archives depuis cette date (AAAA-MM-JJ). Laisser vide pour une collecte normale."
        required: false
        default: ""
      retester_inactives:
        description: "Retester aussi les sources inactives (sinon : automatiquement le 1er lundi du mois)"
        type: boolean
        required: false
        default: false

env:
  BRANCHE_VEILLE: main  # dépôt dédié : tout est sur la branche main

permissions:
  contents: write   # pour enregistrer les nouvelles données sur la branche
  pages: write      # pour publier le site
  id-token: write

concurrency:
  group: cyberwatch
  cancel-in-progress: false

jobs:
  collecte:
    # version figée : « ubuntu-latest » passe à Ubuntu 26 le 19/10/2026 (évite une collecte cassée par ce changement)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # pas d'« environment » ici : la collecte et l'enregistrement des données ne doivent jamais
    # attendre une autorisation de déploiement ; seule la publication (job suivant) en dépend
    outputs:
      lancer: ${{ steps.garde.outputs.lancer }}
    steps:
      - name: Récupérer la branche de veille
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCHE_VEILLE }}
          fetch-depth: 0

      - name: Vérifier l'horaire (lundi 7 h, heure de Paris)
        id: garde
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "lancer=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          heure=$(TZ=Europe/Paris date +%-H)
          jour=$(TZ=Europe/Paris date +%Y-%m-%d)
          derniere=$(cut -c1-10 data/version_courante.txt 2>/dev/null || echo "")
          if [ "$heure" -ge 7 ] && [ "$derniere" != "$jour" ]; then
            echo "lancer=true" >> "$GITHUB_OUTPUT"
          else
            echo "Créneau ignoré (il est ${heure} h à Paris, dernière collecte : ${derniere:-aucune})."
            echo "lancer=false" >> "$GITHUB_OUTPUT"
          fi

      # Veille RKC : fichiers (mails .eml/.msg, Word) déposés dans un dépôt PRIVÉ.
      # Facultatif : variable RKC_DEPOT (ex. mon-compte/cyberwatch-rkc) + secret RKC_TOKEN.
      # Le dossier rkc/ n'est jamais publié ni enregistré dans ce dépôt public.
      - name: Récupérer les veilles RKC (dépôt privé)
        if: steps.garde.outputs.lancer == 'true' && vars.RKC_DEPOT != ''
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.RKC_DEPOT }}
          token: ${{ secrets.RKC_TOKEN }}
          path: rkc

      - name: Installer Python
        if: steps.garde.outputs.lancer == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        if: steps.garde.outputs.lancer == 'true'
        run: |
          pip install -r requirements.txt
          # police libre DejaVu pour l'export PDF (accents, polonais, tchèque, grec…)
          sudo apt-get install -y -qq fonts-dejavu-core > /dev/null || true

      # Traduction (Argos Translate) et note de pertinence (sentence-transformers) :
      # modèles open source gratuits. Si cette étape échoue, la collecte continue
      # (textes en langue d'origine, note calculée avec les mots-clés).
      - name: Installer les modèles open source (traduction, pertinence)
        if: steps.garde.outputs.lancer == 'true'
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-traduction.txt
          pip install -r requirements-pertinence.txt

      - name: Garder en cache les modèles (téléchargés une seule fois)
        if: steps.garde.outputs.lancer == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/.cache/huggingface
          key: modeles-v3

      - name: Collecter les nouveaux articles
        if: steps.garde.outputs.lancer == 'true'
        run: python collecte/collecte.py
        env:
          RATTRAPAGE_DEPUIS: ${{ github.event.inputs.rattrapage_depuis }}
          RETEST_INACTIVES: ${{ github.event.inputs.retester_inactives }}
          # Journal officiel français : données ouvertes de la DILA, aucun identifiant nécessaire.

      - name: Enregistrer les données et marquer la version
        if: steps.garde.outputs.lancer == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf rkc   # le contenu RKC ne doit jamais être publié
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            version=$(cat data/version_courante.txt)
            git commit -m "Veille : version du ${version}"
            # si une source a été ajoutée depuis le site pendant la collecte
            git pull --rebase origin ${{ env.BRANCHE_VEILLE }}
            git push origin HEAD:${{ env.BRANCHE_VEILLE }}
            # une étiquette par version : le site y renvoie pour consulter l'état complet
            git tag "veille-${version}" && git push origin "veille-${version}" || true
          fi

      - name: Préparer le site (uniquement les fichiers publics)
        if: steps.garde.outputs.lancer == 'true'
        run: |
          mkdir -p _site/data
          cp index.html style.css script.js _site/
          cp data/*.js _site/data/
          cp data/*.pdf _site/data/ 2>/dev/null || true
          cp data/*.xml _site/data/ 2>/dev/null || true   # flux RSS des points clés

      - uses: actions/configure-pages@v5
        if: steps.garde.outputs.lancer == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.garde.outputs.lancer == 'true'
        with:
          path: _site

  # Publication du site, séparée : si GitHub bloque le déploiement (autorisation, incident),
  # les données sont déjà enregistrées et la publication peut être relancée seule (« Re-run jobs »).
  publication:
    needs: collecte
    if: needs.collecte.outputs.lancer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: publication
        uses: actions/deploy-pages@v4
